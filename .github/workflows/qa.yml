name: QA
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pgsql, sodium, intl
          coverage: none
          tools: composer:v2
      - name: Verify PHP 8.4
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); }'
      - name: Install private Acls development contract
        env:
          SYMSVEL_READ_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then echo "::error::SYMSVEL_READ_TOKEN missing"; exit 1; fi
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
      - name: Lint module and migrations
        run: find back/src back/tests Migration -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer qa


  bo-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout languages module
        uses: actions/checkout@v4
      - name: Checkout BO host on dev
        uses: actions/checkout@v4
        with:
          repository: Symsvel-Framework/symsvel-bo
          ref: dev
          path: assembled-bo
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: assembled-bo/package-lock.json
      - name: Assemble languages routes like Tooling
        run: |
          mkdir -p assembled-bo/src/lib/modules/languages/routes/languages/translations
          mkdir -p assembled-bo/src/routes/languages/translations
          mkdir -p assembled-bo/src/lib/translations/languages
          cp bo/src/lib/modules/languages/*.ts assembled-bo/src/lib/modules/languages/
          cp bo/src/lib/translations/*.ts assembled-bo/src/lib/translations/languages/
          cp bo/src/routes/languages/+page.svelte assembled-bo/src/lib/modules/languages/routes/languages/+page.svelte
          cp bo/src/routes/languages/translations/+page.svelte assembled-bo/src/lib/modules/languages/routes/languages/translations/+page.svelte
          cat > assembled-bo/src/routes/languages/+page.svelte <<'ROUTE'
          <script lang="ts">
            import ModulePage from '#lib/modules/languages/routes/languages/+page.svelte';
          </script>
          <ModulePage />
          ROUTE
          cat > assembled-bo/src/routes/languages/translations/+page.svelte <<'ROUTE'
          <script lang="ts">
            import ModulePage from '#lib/modules/languages/routes/languages/translations/+page.svelte';
          </script>
          <ModulePage />
          ROUTE
      - name: Install BO dependencies
        working-directory: assembled-bo
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and Ubuntu dependencies
        working-directory: assembled-bo
        run: npx playwright install --with-deps chromium
      - name: Format assembled BO (same convention as BO CI)
        working-directory: assembled-bo
        run: npm run format
      - name: Validate assembled BO types, style, build and tests
        working-directory: assembled-bo
        run: |
          npm run check
          npm run lint
          npm run build
          npm run test:unit -- --run

  database-boolean-matrix:
    # The GitHub-hosted runner has dedicated ephemeral database services.
    concurrency:
      group: symsvel-languages-boolean-${{ github.ref }}-${{ matrix.engine }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: symsvel_ci
          POSTGRES_PASSWORD: symsvel_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symsvel_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: symsvel_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psymsvel_ci_only"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: symsvel_ci_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pgsql, sodium, intl
          coverage: none
          tools: composer:v2
      - name: Verify PHP 8.4 and PDO drivers
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          php -r '$driver = getenv("ENGINE") === "postgres" ? "pdo_pgsql" : "pdo_mysql"; if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500 || !extension_loaded($driver)) { fwrite(STDERR, "Missing PHP version or $driver\n"); exit(1); }'
      - name: Install private dependencies
        env:
          SYMSVEL_READ_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SYMSVEL_READ_TOKEN" ]; then echo "::error::SYMSVEL_READ_TOKEN missing"; exit 1; fi
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("SYMSVEL_READ_TOKEN")]], JSON_THROW_ON_ERROR);')"
          composer install --no-interaction --prefer-dist --no-progress
      - name: Install PostgreSQL and MySQL clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client default-mysql-client
      - name: Exercise typed translation flags against a real database
        env:
          ENGINE: ${{ matrix.engine }}
          SYMSVEL_CI_POSTGRES_PASSWORD: symsvel_ci_only
        run: |
          if [ -z "$SYMSVEL_CI_POSTGRES_PASSWORD" ]; then echo "::error::Database secret missing"; exit 1; fi
          case "$ENGINE" in
            postgres)
              export PGPASSWORD="$SYMSVEL_CI_POSTGRES_PASSWORD"
              pg_isready -h 127.0.0.1 -U symsvel_ci -d postgres
              dropdb --if-exists --force -h 127.0.0.1 -U symsvel_ci symsvel_languages_bool_ci
              createdb -h 127.0.0.1 -U symsvel_ci symsvel_languages_bool_ci
              export SYMSVEL_LANGUAGES_TEST_DATABASE_URL="$(php -r 'echo "postgresql://symsvel_ci:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@127.0.0.1:5432/symsvel_languages_bool_ci";')"
              ;;
            mysql|mariadb)
              export PORT=3306
              if [ "$ENGINE" = mariadb ]; then PORT=3307; fi
              mysql --host=127.0.0.1 --port="$PORT" --protocol=tcp --user=root --password="$SYMSVEL_CI_POSTGRES_PASSWORD" --execute='DROP DATABASE IF EXISTS symsvel_languages_bool_ci; CREATE DATABASE symsvel_languages_bool_ci'
              export SYMSVEL_LANGUAGES_TEST_DATABASE_URL="$(php -r 'echo "mysql://root:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@"127.0.0.1:".getenv("PORT")/symsvel_languages_bool_ci";')"
              ;;
          esac
          vendor/bin/phpunit -c back/phpunit.xml.dist back/tests/Integration/TranslationSourceDbalMatrixTest.php
